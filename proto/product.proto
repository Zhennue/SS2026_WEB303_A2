syntax = "proto3";
package novacart;
option go_package = "novacart/proto;proto";
service ProductService {
  rpc CreateProduct(Product) returns (Product);
  rpc GetProduct(ProductID) returns (Product);
  rpc ListProducts(Empty) returns (ProductList);
  rpc UpdateProduct(Product) returns (Product);
  rpc DeleteProduct(ProductID) returns (DeleteResponse);
}
message Empty {}
message ProductID { string id = 1; }
message Product { string id = 1; string name = 2; double price = 3; string description = 4; }
message ProductList { repeated Product products = 1; }
message DeleteResponse { bool deleted = 1; }
